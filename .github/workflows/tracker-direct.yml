name: Bus Fare Drop Tracker (redBus direct, no Apify)

on:
  # Schedule disabled — GitHub's cron is best-effort and drops most runs on public
  # repos. Triggering is now external (cron-job.org) and targets tracker-loop.yml,
  # which keeps checking for ~6h per dispatch.
  # schedule:
  #   - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-fares:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v4
        with:
          # Full history so the rebase-retry in the commit step always has a base.
          fetch-depth: 0

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        id: install-dependencies
        run: |
          echo "Installing Python dependencies..."
          python -m pip install --upgrade pip
          pip install requests
          echo "Dependency installation completed."

      - name: Run price tracker
        id: tracker
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python -u src/tracker_direct.py

      - name: Commit updated fare history
        id: commit-history
        run: |
          set -euo pipefail

          echo "Checking whether fare history changed..."
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          # Stage separately: a missing cities.json must never block the history add.
          git add data/history.json
          git add data/cities.json || true

          if git diff --staged --quiet; then
            echo "No fare-history changes to commit."
            exit 0
          fi

          BRANCH="${GITHUB_REF_NAME}"
          git commit -m "Update fare history [skip ci]"

          # tracker-loop.yml shares this repository and pushes every 15 minutes, so a
          # manual run can lose the race. Retry instead of failing the job.
          ATTEMPTS=5
          for attempt in $(seq 1 "$ATTEMPTS"); do
            echo "Push attempt $attempt/$ATTEMPTS on branch $BRANCH"

            if git pull --rebase --autostash origin "$BRANCH" && git push origin "HEAD:$BRANCH"; then
              echo "Fare history committed and pushed."
              exit 0
            fi

            # A conflicting history.json leaves a rebase in progress; clear it so the
            # next attempt starts from a known state.
            git rebase --abort >/dev/null 2>&1 || true

            # Rebase can still conflict on this machine-generated file. Fall back to
            # replaying our snapshot as a single commit on top of the remote tip:
            # our fetch is the newest data, so our version of the file should win.
            if git fetch origin "$BRANCH" \
              && git reset --soft "origin/$BRANCH" \
              && git commit -m "Update fare history [skip ci]"; then
              if git push origin "HEAD:$BRANCH"; then
                echo "Fare history committed and pushed (after replay onto remote tip)."
                exit 0
              fi
            fi

            sleep $(( attempt * 5 ))
          done

          echo "::error::Could not push fare history after $ATTEMPTS attempts. The snapshot from this run was not saved."
          exit 1

      - name: Add run summary
        if: always()
        env:
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          SETUP_OUTCOME: ${{ steps.setup-python.outcome }}
          INSTALL_OUTCOME: ${{ steps.install-dependencies.outcome }}
          TRACKER_OUTCOME: ${{ steps.tracker.outcome }}
          HISTORY_OUTCOME: ${{ steps.commit-history.outcome }}
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "## Bus fare tracker (redBus direct)"
            echo
            echo "**Overall result:** ${JOB_STATUS}"
            echo
            echo "| Step | Result |"
            echo "| --- | --- |"
            echo "| Checkout repository | ${CHECKOUT_OUTCOME:-not run} |"
            echo "| Set up Python | ${SETUP_OUTCOME:-not run} |"
            echo "| Install dependencies | ${INSTALL_OUTCOME:-not run} |"
            echo "| Run price tracker | ${TRACKER_OUTCOME:-not run} |"
            echo "| Commit fare history | ${HISTORY_OUTCOME:-not run} |"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          echo "GitHub Actions run summary written."
